version: "3.9"

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eng-academy-web
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: eng-academy-db
    restart: always
    environment:
      POSTGRES_USER: eng_admin
      POSTGRES_PASSWORD: eng_secure_password_2026
      POSTGRES_DB: eng_academy_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eng_admin -d eng_academy_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
